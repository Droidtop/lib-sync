[package]
name = "sync-store"
description = "This computer's droidtop agent state on disk: identity shared with windowcast, paired devices, settings and the library"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "droidtop_agent_store"
path = "src/lib.rs"

[dependencies]
droidtop-agent-core = { package = "sync-core", path = "../core" }
windowcast-identity.workspace = true
serde.workspace = true
serde_json.workspace = true
dirs.workspace = true
gethostname.workspace = true
# The store's operating system lock on Rust 1.85 (std has File::lock from 1.89 only): flock on Unix,
# LockFileEx on Windows, as std's.
fs4 = "1.1"
