[package]
name = "sync-store"
description = "This computer's droidtop agent state on disk: identity shared with windowcast, paired devices, settings and the library"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "droidtop_agent_store"
path = "src/lib.rs"

[dependencies]
droidtop-agent-core = { package = "sync-core", path = "../core" }
windowcast-identity.workspace = true
serde.workspace = true
serde_json.workspace = true
dirs.workspace = true
gethostname.workspace = true

# Android's file lock (lock_exclusive in src/lib.rs): std's answers Unsupported there before Rust 1.98.
[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2.191"
