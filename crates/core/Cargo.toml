[package]
name = "sync-core"
description = "The part of droidtop-agent both ends share: identity, pairing, the session channel, the protocol and the sync rules"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# The name code imports it by, unchanged from droidtop-agent (Droidtop/tracker#867 step 1 moves code
# without editing it; renaming the imports is a later, mechanical change).
[lib]
name = "droidtop_agent_core"
path = "src/lib.rs"

[features]
# A lib-net share (WebDAV, SFTP, S3) as a store-and-forward share: share::RemoteShare.
net-remote = ["dep:net-remote"]

[dependencies]
net-remote = { workspace = true, optional = true }
windowcast-identity.workspace = true
windowcast-pairing.workspace = true
ed25519-dalek.workspace = true
x25519-dalek.workspace = true
rustls.workspace = true
rustls-webpki.workspace = true
rcgen.workspace = true
boringtun.workspace = true
smoltcp.workspace = true
chacha20poly1305.workspace = true
sha2.workspace = true
hkdf.workspace = true
rand_core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
age.workspace = true
# Rendezvous away from the LAN (src/rendezvous.rs): Syncthing's global
# discovery and STUN, in the crate windowcast and droidtop-agent share.
windowcast-rendezvous.workspace = true
