name: CI

# lib-sync's own checks, then every program that uses it, built and tested against this commit
# (Droidtop/tracker#867 D2: "each repo's CI builds and tests every app that uses it"). Work lands
# on main from ci/* branches once this is green.
#
# Programs that use lib-sync:
# - droidtop-agent: its workspace, built and tested on Linux.
# - droidtop: through droidtop-agent's crates/android (libdroidtop_agent.so), built here for both
#   Android ABIs the way droidtop-agent's CI builds it.
# Pythia joins when its native module moves onto the libraries (#867 step 1).
on:
  push:
    branches: [main, "ci/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Format check
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: Clippy
        if: success() || failure()
        run: cargo clippy --workspace --all-targets --keep-going -- -D warnings
      - name: Test
        if: success() || failure()
        run: cargo test --workspace --no-fail-fast

  # droidtop-agent's main, with lib-sync taken from this commit instead of its pinned tag.
  droidtop-agent:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: lib
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Droidtop/droidtop-agent
          path: agent
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: agent
      - name: Build and test droidtop-agent against this commit
        working-directory: agent
        run: |
          cargo --config 'patch."https://github.com/Droidtop/lib-sync".sync-core.path="../lib/crates/core"' \
            --config 'patch."https://github.com/Droidtop/lib-sync".sync-store.path="../lib/crates/store"' \
            --config 'patch."https://github.com/Droidtop/lib-sync".sync-pair.path="../lib/crates/pair"' \
            test --workspace --no-fail-fast
      - name: Build droidtop's library (libdroidtop_agent.so) for arm64-v8a and x86_64
        working-directory: agent
        shell: bash
        run: |
          set -eu
          ndk="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$bin/aarch64-linux-android26-clang"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$bin/x86_64-linux-android26-clang"
          export CC_aarch64_linux_android="$bin/aarch64-linux-android26-clang"
          export CC_x86_64_linux_android="$bin/x86_64-linux-android26-clang"
          export AR_aarch64_linux_android="$bin/llvm-ar"
          export AR_x86_64_linux_android="$bin/llvm-ar"
          for target in aarch64-linux-android x86_64-linux-android; do
            cargo --config 'patch."https://github.com/Droidtop/lib-sync".sync-core.path="../lib/crates/core"' \
            --config 'patch."https://github.com/Droidtop/lib-sync".sync-store.path="../lib/crates/store"' \
            --config 'patch."https://github.com/Droidtop/lib-sync".sync-pair.path="../lib/crates/pair"' \
              build --release -p droidtop-agent-android --target "$target"
          done
          ls -l target/*-linux-android/release/libdroidtop_agent.so

  # A green main whose version has no tag yet is released: CI tags v<version> on this commit, and that tag
  # is what programs and the other libraries pin (Droidtop/tracker#867 D2). To release, raise the version
  # in the root Cargo.toml (and the CHANGELOG) in the change that needs it.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, droidtop-agent]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Tag this version if it is new
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          [ -n "$version" ] || { echo "no version in Cargo.toml" >&2; exit 1; }
          tag="v$version"
          if gh api "repos/$REPO/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "$tag is already released"
          else
            gh api -X POST "repos/$REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" >/dev/null
            echo "released $tag at $GITHUB_SHA"
          fi
