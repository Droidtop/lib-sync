name: CI

# lib-sync's own checks, then every program that uses it, built and tested against this commit
# (Droidtop/tracker#867 D2: "each repo's CI builds and tests every app that uses it"). Work lands
# on main from ci/* branches once this is green.
#
# Programs that use lib-sync:
# - droidtop-agent: its workspace, built and tested on Linux.
# - droidtop: through droidtop-agent's crates/android (libdroidtop_agent.so), built here for both
#   Android ABIs the way droidtop-agent's CI builds it.
# Pythia joins when its native module moves onto the libraries (#867 step 1).
on:
  push:
    branches: [main, "ci/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Format check
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: Clippy
        if: success() || failure()
        run: cargo clippy --workspace --all-targets --keep-going -- -D warnings
      - name: Test
        if: success() || failure()
        run: cargo test --workspace --no-fail-fast
      # sync-core with lib-net's share client (its net-remote feature, Droidtop/tracker#573): off by default, so the
      # steps above never build it. Linux only: net-remote's own CI covers its backends on the platforms it targets.
      - name: Clippy and test with the net-remote feature
        if: runner.os == 'Linux' && (success() || failure())
        run: |
          cargo clippy -p sync-core --features net-remote --all-targets -- -D warnings
          cargo test -p sync-core --features net-remote --no-fail-fast

  # The oldest Rust these crates support, rust-version in Cargo.toml: Pythia builds them with Ubuntu's rustc-1.91, as
  # Launchpad does. The checked-in Cargo.lock is resolved for stable, so this resolves one the way a consumer's would:
  # with cargo's MSRV-aware resolver, which picks dependency versions 1.91 can build.
  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.91"
      - name: Check with Rust 1.91
        env:
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
        run: |
          cargo generate-lockfile
          cargo check --workspace --all-targets

  # The library's public interface stays compatible within a version (Droidtop/tracker#867, owner 2026-11-04: "I
  # should be able to bump the version number and immediately get the benefit"). cargo-semver-checks compares this
  # commit with the last release: a breaking change fails unless the version says so (in 0.x, a new minor) and the
  # CHANGELOG says what broke.
  semver:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: taiki-e/install-action@0e09747a63ae497bf945b3dcaf38fef0050d0109 # v2.62.0
        with:
          tool: cargo-semver-checks@0.51.0
      - name: No breaking change without a version that says so
        run: |
          set -eu
          last="$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD 2>/dev/null || true)"
          if [ -z "$last" ]; then echo "nothing released yet; nothing to compare"; exit 0; fi
          echo "comparing with $last"
          cargo semver-checks check-release --workspace --baseline-rev "$last"

  # droidtop-agent, built and tested with lib-sync taken from this commit (scripts/with-this-library.sh).
  droidtop-agent:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: lib
          persist-credentials: false
      - name: The droidtop-agent branch this change goes with
        id: pair
        shell: bash
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          ref=main
          # A change that droidtop-agent must follow is one change in two repositories: a ci/ branch of the same name there
          # is built with this one. While droidtop-agent's half of such a change has not landed,
          # .github/users-build-ref names its branch, so main and the release build against it.
          named="$(cat lib/.github/users-build-ref 2>/dev/null | tr -d '[:space:]' || true)"
          if [[ "$BRANCH" == ci/* ]] && git ls-remote --exit-code --heads https://github.com/Droidtop/droidtop-agent "refs/heads/$BRANCH" >/dev/null; then
            ref="$BRANCH"
          elif [[ "$named" == ci/* ]] && git ls-remote --exit-code --heads https://github.com/Droidtop/droidtop-agent "refs/heads/$named" >/dev/null; then
            ref="$named"
          fi
          echo "droidtop-agent: $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Droidtop/droidtop-agent
          ref: ${{ steps.pair.outputs.ref }}
          path: agent
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: agent
      # droidtop-agent's stream crate links windowcast's host, which links libpam (as droidtop-agent's own CI installs).
      - name: Install libpam for the stream test
        run: sudo apt-get update && sudo apt-get install -y libpam0g-dev
      - name: Build and test droidtop-agent against this commit
        run: lib/scripts/with-this-library.sh agent test --workspace --no-fail-fast

  # droidtop's native library (droidtop native/, libdroidtop_agent.so), built and tested with lib-sync taken from this
  # commit, on the runner and for both Android ABIs as droidtop's build-scripts/build-agent-lib.sh does.
  droidtop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: lib
          persist-credentials: false
      - name: The droidtop branch this change goes with
        id: pair
        shell: bash
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          ref=main
          # A change that droidtop must follow is one change in two repositories: a ci/ branch of the same name there
          # is built with this one, or the branch .github/users-build-ref names while the users' half has not landed
          # (the same branch name in droidtop-agent and droidtop: Droidtop/tracker#798's ci/link-change).
          named="$(cat lib/.github/users-build-ref 2>/dev/null | tr -d '[:space:]' || true)"
          if [[ "$BRANCH" == ci/* ]] && git ls-remote --exit-code --heads https://github.com/Droidtop/droidtop "refs/heads/$BRANCH" >/dev/null; then
            ref="$BRANCH"
          elif [[ "$named" == ci/* ]] && git ls-remote --exit-code --heads https://github.com/Droidtop/droidtop "refs/heads/$named" >/dev/null; then
            ref="$named"
          fi
          echo "droidtop: $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Droidtop/droidtop
          ref: ${{ steps.pair.outputs.ref }}
          path: droidtop
          sparse-checkout: native
          persist-credentials: false
      # When the pairing named a ci/ branch, droidtop-agent's half of the change is built in too (its service runs
      # native/'s mesh test).
      - name: droidtop-agent's half, if the pairing names one
        if: startsWith(steps.pair.outputs.ref, 'ci/')
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Droidtop/droidtop-agent
          ref: ${{ steps.pair.outputs.ref }}
          path: agent
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: droidtop/native
      - name: Test droidtop's native library against this commit
        env:
          AGENT_DIR: ${{ startsWith(steps.pair.outputs.ref, 'ci/') && 'agent' || '' }}
        run: lib/scripts/with-this-library.sh droidtop/native test --locked
      - name: Build it for arm64-v8a and x86_64
        shell: bash
        env:
          AGENT_DIR: ${{ startsWith(steps.pair.outputs.ref, 'ci/') && 'agent' || '' }}
        run: |
          set -eu
          ndk="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$bin/aarch64-linux-android26-clang"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$bin/x86_64-linux-android26-clang"
          export CC_aarch64_linux_android="$bin/aarch64-linux-android26-clang"
          export CC_x86_64_linux_android="$bin/x86_64-linux-android26-clang"
          export AR_aarch64_linux_android="$bin/llvm-ar"
          export AR_x86_64_linux_android="$bin/llvm-ar"
          for target in aarch64-linux-android x86_64-linux-android; do
            lib/scripts/with-this-library.sh droidtop/native build --release --target "$target"
          done
          ls -l droidtop/native/target/*-linux-android/release/libdroidtop_agent.so 2>/dev/null || true

  # A green main whose version has no tag yet is released: CI tags v<version> on this commit, and that tag
  # is what programs and the other libraries pin (Droidtop/tracker#867 D2). To release, raise the version
  # in the root Cargo.toml (and the CHANGELOG) in the change that needs it.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, droidtop-agent, semver, droidtop]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Tag this version if it is new
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          [ -n "$version" ] || { echo "no version in Cargo.toml" >&2; exit 1; }
          tag="v$version"
          if gh api "repos/$REPO/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "$tag is already released"
          else
            gh api -X POST "repos/$REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" >/dev/null
            echo "released $tag at $GITHUB_SHA"
          fi
